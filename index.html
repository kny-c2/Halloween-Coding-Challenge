<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midnight Broomstick Ride</title>
  <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>
  <main>
    <div class="scene" role="img" aria-label="A witch on a trotting broomstick trailing sparks flies over a hay wagon where a couple waves.">

      <!-- WITCH & SPARKS -->
      <div class="witch">
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="rider"><span class="flip">🧙‍♀️🧹</span></span>
      </div>

      <!-- HAY WAGON & WAVING COUPLE -->
      <div class="wagon">
        <span class="horse">🐴</span>
        <div class="hay">
          <span class="person">👩<span class="hand">👋</span></span>
          <span class="person">👨<span class="hand">👋</span></span>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
