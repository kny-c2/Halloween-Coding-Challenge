<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midnight Broomstick Ride</title>
  <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>
  <main>

    <div class="scenes">
      <div class="scene" role="img" aria-label="A witch on a trotting broomstick trailing sparks flies over a hay wagon where a couple waves.">

        <div class="witch">
          <span class="spark"></span>
          <span class="spark"></span>
          <span class="spark"></span>
          <span class="rider"><span class="flip">🧙‍♀️🧹</span></span>
        </div>

        <div class="wagon">
          <span class="horse">🐴</span>
          <div class="hay">
            <span class="person">👩<span class="hand">👋</span></span>
            <span class="person">👨<span class="hand">👋</span></span>
          </div>
        </div>

        <div class="owl owl-one" aria-hidden="true">🦉</div>
        <div class="scene-overlay" aria-hidden="true">
          <div class="pumpkin-marker pumpkin-marker-one">✦</div>
          <div class="pumpkin-marker pumpkin-marker-two">✦</div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
